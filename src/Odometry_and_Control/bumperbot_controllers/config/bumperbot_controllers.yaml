controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    simple_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

# Parameters for the custom simple velocity controller spawner.
# Controls left/right wheel joints directly via velocity commands.
simple_velocity_controller:
  ros__parameters:
    joints:
      - wheel_left_joint
      - wheel_right_joint

# Parameters for the hand-written diff_drive_kinematics node.
# Converts /cmd_vel (linear + angular) → individual wheel velocity commands
# using the differential-drive kinematic equations built during the course.
diff_drive_kinematics:
  ros__parameters:
    wheel_radius: 0.034        # metres
    wheel_separation: 0.174    # metres (centre-to-centre)
    use_sim_time: true

# Parameters for the odometry noise injection node.
# Simulates real-world wheel slip / encoder drift for learning purposes.
adding_noise_to_odometry:
  ros__parameters:
    wheel_radius: 0.034
    wheel_separation: 0.174
    noise_factor: 0.005